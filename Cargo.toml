[package]
name = "svenskabot"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }

thiserror = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
poise = "0.7.0"

[profile.release]
debug = true
